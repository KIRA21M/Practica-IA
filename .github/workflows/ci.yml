name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check syntax
        run: npm run check

      - name: Audit dependencies
        run: npm audit --omit=dev

  ml-service:
    name: ML service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate training and prediction
        run: |
          python train.py
          python -m py_compile app.py
          python -m py_compile train.py
          python -c "from app import data, model; assert len(data) == 200; assert model.predict(['Alguien entró a mi cuenta sin autorización'])[0] == 'SECURITY'"

  generative-comparison:
    name: Generative comparison
    # Repository secrets are unavailable to pull requests from forks. Keep
    # the generative gate strict for internal branches while allowing tests
    # from external contributors to run without exposing the API key.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: tests
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: ollama
      OLLAMA_MODEL: gemma3:1b
      OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
      GENERATION_TIMEOUT_MS: 20000
      REQUIRE_GENERATIVE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/ollama.log"
          exit 1

      - name: Download local model
        run: ollama pull gemma3:1b

      - name: Run comparison
        run: |
          mkdir -p artifacts
          node src/evaluation/compare.js > artifacts/comparison-results.json

      - name: Upload comparison results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: comparison-results
          path: artifacts/comparison-results.json
